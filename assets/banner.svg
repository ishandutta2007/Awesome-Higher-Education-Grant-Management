<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="80" r="140" fill="#6366f1" opacity="0.25" filter="url(#glow)" />
  <circle cx="1050" cy="280" r="160" fill="#ec4899" opacity="0.20" filter="url(#glow)" />
  <circle cx="600" cy="180" r="180" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />

  <!-- Border Outline with Gradient Stroke -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

  <!-- Top Decorative Badge / Pill -->
  <g transform="translate(60, 42)">
    <rect width="270" height="30" rx="15" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
    <circle cx="15" cy="15" r="4" fill="#a5b4fc" />
    <text x="28" y="19.5" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">RESEARCH ADMINISTRATION</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(60, 118)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Higher Education
    </text>
    <text y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="url(#primaryGrad)" letter-spacing="-0.5">
      Grant Management
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(60, 205)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8" font-weight="400">
      A curated ecosystem of Enterprise eRA Suites, SaaS Platforms, Compliance Tools, and Open-Source Projects
    </text>
  </g>

  <!-- Lifecycle Stage Cards / Badges at Bottom -->
  <g transform="translate(60, 248)">
    <!-- Stage 1: Discovery -->
    <g transform="translate(0, 0)">
      <rect width="252" height="68" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <circle cx="28" cy="34" r="14" fill="rgba(6, 182, 212, 0.15)" />
      <text x="28" y="39" text-anchor="middle" font-size="14">🔭</text>
      <text x="52" y="29" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">1. Discovery</text>
      <text x="52" y="47" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">RFP Matching &amp; Alerts</text>
    </g>

    <!-- Stage 2: Pre-Award -->
    <g transform="translate(276, 0)">
      <rect width="252" height="68" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <circle cx="28" cy="34" r="14" fill="rgba(139, 92, 246, 0.15)" />
      <text x="28" y="39" text-anchor="middle" font-size="14">📝</text>
      <text x="52" y="29" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">2. Pre-Award</text>
      <text x="52" y="47" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Budget, F&amp;A &amp; S2S Routing</text>
    </g>

    <!-- Stage 3: Compliance -->
    <g transform="translate(552, 0)">
      <rect width="252" height="68" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <circle cx="28" cy="34" r="14" fill="rgba(245, 158, 11, 0.15)" />
      <text x="28" y="39" text-anchor="middle" font-size="14">🛡️</text>
      <text x="52" y="29" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">3. Compliance</text>
      <text x="52" y="47" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">IRB, IACUC, COI &amp; IBC</text>
    </g>

    <!-- Stage 4: Post-Award -->
    <g transform="translate(828, 0)">
      <rect width="252" height="68" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <circle cx="28" cy="34" r="14" fill="rgba(16, 185, 129, 0.15)" />
      <text x="28" y="39" text-anchor="middle" font-size="14">💰</text>
      <text x="52" y="29" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">4. Post-Award</text>
      <text x="52" y="47" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Accounting &amp; Effort Cert</text>
    </g>
  </g>

  <!-- Right Decorative Emblem / Graphic -->
  <g transform="translate(970, 50)">
    <!-- Outer Glow Circle -->
    <circle cx="90" cy="80" r="75" fill="none" stroke="rgba(139, 92, 246, 0.2)" stroke-width="2" stroke-dasharray="6,6" />
    <circle cx="90" cy="80" r="60" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.5" />

    <!-- Academy / Shield / Award Visual Icon -->
    <g transform="translate(58, 48)">
      <!-- Academic Cap & Pillar Graphic -->
      <path d="M 32 6 L 58 19 L 32 32 L 6 19 Z" fill="url(#primaryGrad)" />
      <path d="M 52 23 L 52 35 C 52 35 48 40 32 40 C 16 40 12 35 12 35 L 12 23 L 32 33 Z" fill="url(#cyanGrad)" opacity="0.9" />
      <path d="M 54 20 L 58 20 L 58 38 C 58 40 56 42 54 42 C 52 42 50 40 50 38 L 50 20 Z" fill="#ec4899" />
      <circle cx="54" cy="43" r="3" fill="#fb7185" />
      
      <!-- Stars -->
      <path d="M 32 48 L 34 53 L 39 53 L 35 56 L 37 61 L 32 58 L 27 61 L 29 56 L 25 53 L 30 53 Z" fill="#f59e0b" />
    </g>
  </g>
</svg>
